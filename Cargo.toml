[package]
name = "lazyapi"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-first terminal API inspector for OpenAPI services"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
tiny_http = "0.12"
url = "2.5"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = true
