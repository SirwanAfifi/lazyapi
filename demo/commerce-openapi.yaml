openapi: 3.0.3
info:
  title: Northstar Commerce API
  version: 2.4.0
  description: A multi-tenant commerce API used for the LazyAPI terminal demo.
servers:
  - url: https://api.northstar.example/v2
tags:
  - name: catalog
  - name: customers
  - name: orders
  - name: payments
  - name: inventory
  - name: integrations
  - name: operations
paths:
  /catalog/products:
    get:
      operationId: listProducts
      summary: Search the product catalog
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: query
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Matching products
          content:
            application/json:
              example:
                data:
                  - sku: SKU-RED-42
                    name: Aurora Trail Jacket
                    price:
                      amount: 129.95
                      currency: GBP
                    available: 18
                nextCursor: eyJwYWdlIjoyfQ==
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                  nextCursor:
                    type: string
                    nullable: true
  /catalog/products/{sku}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: sku
        in: path
        required: true
        schema:
          type: string
          pattern: "^[A-Z0-9-]+$"
    get:
      operationId: getProduct
      summary: Fetch a product and its stock
      tags: [catalog, inventory]
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
  /customers/{customerId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/CustomerId"
    get:
      operationId: getCustomer
      summary: Fetch a customer profile
      tags: [customers]
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              example:
                id: cus_01J8Y8VMQY
                name: Ada Lovelace
                email: ada@example.test
                loyaltyTier: gold
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          $ref: "#/components/responses/NotFound"
  /customers/{customerId}/orders:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/CustomerId"
    get:
      operationId: listCustomerOrders
      summary: List a customer's recent orders
      tags: [customers, orders]
      responses:
        "200":
          description: Recent orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /orders:
    post:
      operationId: createOrder
      summary: Create and price an order
      tags: [orders]
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              example:
                id: ord_01J8Y91C7K
                customerId: cus_01J8Y8VMQY
                status: pending_payment
                total:
                  amount: 259.90
                  currency: GBP
                lines:
                  - sku: SKU-RED-42
                    quantity: 2
              schema:
                $ref: "#/components/schemas/Order"
        "409":
          description: Duplicate idempotency key
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /orders/{orderId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/OrderId"
    get:
      operationId: getOrder
      summary: Fetch an order
      tags: [orders]
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"
  /orders/{orderId}/payments:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/OrderId"
    post:
      operationId: authorizePayment
      summary: Authorize payment for an order
      tags: [payments, orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentMethodId, amount]
              properties:
                paymentMethodId:
                  type: string
                  pattern: "^pm_"
                amount:
                  $ref: "#/components/schemas/Money"
      responses:
        "202":
          description: Payment authorization queued
          content:
            application/json:
              example:
                paymentId: pay_01J8YA0DPQ
                status: processing
              schema:
                type: object
                required: [paymentId, status]
                properties:
                  paymentId:
                    type: string
                  status:
                    type: string
                    enum: [processing, authorized, declined]
  /inventory/reservations:
    post:
      operationId: reserveInventory
      summary: Reserve stock for an order
      tags: [inventory, orders]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, lines]
              properties:
                orderId:
                  type: string
                lines:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/OrderLine"
      responses:
        "201":
          description: Inventory reserved
          content:
            application/json:
              example:
                reservationId: res_01J8YAA7BD
                expiresAt: "2026-08-30T12:15:00Z"
              schema:
                type: object
                required: [reservationId, expiresAt]
                properties:
                  reservationId:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
  /webhooks/orders:
    post:
      operationId: receiveOrderWebhook
      summary: Receive order lifecycle events
      tags: [integrations, orders]
      parameters:
        - name: X-Webhook-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, eventType, order]
              properties:
                eventId:
                  type: string
                eventType:
                  type: string
                  enum: [order.created, order.paid, order.cancelled]
                order:
                  $ref: "#/components/schemas/Order"
      responses:
        "202":
          description: Event accepted
  /health:
    get:
      operationId: healthCheck
      summary: Check service dependencies
      tags: [operations]
      responses:
        "200":
          description: Dependency status
          content:
            application/json:
              example:
                status: healthy
                dependencies:
                  postgres: healthy
                  redis: healthy
                  payments: degraded
              schema:
                type: object
                required: [status, dependencies]
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded]
                  dependencies:
                    type: object
                    additionalProperties:
                      type: string
components:
  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
        example: northstar-uk
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        pattern: "^cus_[A-Z0-9]+$"
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        pattern: "^ord_[A-Z0-9]+$"
  responses:
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          example:
            type: https://errors.northstar.example/not-found
            title: Resource not found
            status: 404
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: GBP
    Product:
      type: object
      required: [sku, name, price, available]
      properties:
        sku:
          type: string
          example: SKU-RED-42
        name:
          type: string
          example: Aurora Trail Jacket
        price:
          $ref: "#/components/schemas/Money"
        available:
          type: integer
          minimum: 0
    Customer:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        loyaltyTier:
          type: string
          enum: [standard, silver, gold]
    OrderLine:
      type: object
      required: [sku, quantity]
      properties:
        sku:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 25
    CreateOrderRequest:
      type: object
      required: [customerId, currency, items]
      properties:
        customerId:
          type: string
          pattern: "^cus_[A-Z0-9]+$"
        currency:
          type: string
          enum: [GBP, EUR, USD]
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderLine"
        metadata:
          type: object
          additionalProperties:
            type: string
    Order:
      type: object
      required: [id, customerId, status, total, lines]
      properties:
        id:
          type: string
        customerId:
          type: string
        status:
          type: string
          enum: [pending_payment, paid, fulfilled, cancelled]
        total:
          $ref: "#/components/schemas/Money"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
    Problem:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
